onboarding = false

[keys]
switch_tab = ""
switch_workspace = "prefix+1..9"
focus_pane_left = "prefix+ctrl+h"
focus_pane_down = "prefix+ctrl+j"
focus_pane_up = "prefix+ctrl+k"
focus_pane_right = "prefix+ctrl+l"
# Alacritty sends these as CSI u sequences (see alacritty.toml).
next_workspace = "ctrl+tab"
previous_workspace = "ctrl+shift+tab"

# Inspection popups. Each opens over the current pane in its working directory
# and closes when the command exits.
[[keys.command]]
key = "prefix+alt+d"
type = "popup"
# Same review as Pi's /diff; on q, comments are sent to the agent in the focused pane.
command = '''nvim -n -i NONE -c "lua require('pi_diff').popup()"'''
description = "review diff, send comments to agent"
width = "95%"
height = "95%"

[[keys.command]]
key = "prefix+alt+f"
type = "popup"
command = '''fd --type f --hidden --exclude .git | fzf --preview "bat --color=always --style=numbers --theme=ansi {}" --bind "enter:become(nvim -R {})"'''
description = "find file (opens read-only)"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+alt+s"
type = "popup"
command = '''fzf --ansi --disabled --delimiter : --bind "change:reload:rg --hidden --glob '!.git' --line-number --color=always --smart-case -- {q} || true" --preview "bat --color=always --style=numbers --theme=ansi --highlight-line {2} {1}" --preview-window "+{2}/2" --bind "enter:become(nvim -R +{2} {1})"'''
description = "search text (opens read-only)"
width = "90%"
height = "90%"

[ui]
status_indicators = "symbols"

# $num is reported by the lee.space-numbers plugin as "<prefix+N> <label>".
[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "$num", bold = true }],
  ["branch", "git_status"],
]

[ui.sound]
enabled = false

[ui.toast]
delivery = "herdr"

[theme]
name = "terminal"
auto_switch = false

# Kanso Mist palette with a raised sidebar surface for contrast.
[theme.custom]
panel_bg = "#22262D"
sidebar_bg = "#2A2C35"
active_row_bg = "#393B44"
selection_bg = "#393B44"
surface0 = "#2A2C35"
surface1 = "#393B44"
surface_dim = "#22262D"
overlay0 = "#909398"
overlay1 = "#A4A7A4"
text = "#C5C9C7"
subtext0 = "#A4A7A4"
accent = "#7FB4CA"
blue = "#7FB4CA"
teal = "#6A9589"
mauve = "#938AA9"
green = "#98BB6C"
yellow = "#DCA561"
red = "#C34043"
peach = "#B6927B"
