id = "lee.space-numbers"
name = "Space Numbers"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Expose each Space's prefix+N jump number and label as the $num sidebar token."
platforms = ["linux"]

[[startup]]
# Refreshes once, then starts watch.py in the background to follow pane.updated.
command = ["bash", "start-watcher.bash"]

[[events]]
on = "workspace.created"
command = ["bash", "space-numbers.bash"]

[[events]]
on = "workspace.closed"
command = ["bash", "space-numbers.bash"]

[[events]]
on = "workspace.moved"
command = ["bash", "space-numbers.bash"]

[[events]]
on = "workspace.renamed"
command = ["bash", "space-numbers.bash"]

[[events]]
on = "workspace.reordered"
command = ["bash", "space-numbers.bash"]
