os:
  editCommand: "vi"
  editCommandTemplate: '{{editor}} "$(pwd)/{{filename}}"'
gui:
  # Kanso Mist (Neovim's kanso-mist palette).
  theme:
    activeBorderColor: ['#7FB4CA', 'bold']
    inactiveBorderColor: ['#5C6066']
    searchingActiveBorderColor: ['#DCA561', 'bold']
    optionsTextColor: ['#7FB4CA']
    selectedLineBgColor: ['#393B44']
    cherryPickedCommitBgColor: ['#2A2C35']
    cherryPickedCommitFgColor: ['#938AA9']
    unstagedChangesColor: ['#C34043']
    defaultFgColor: ['#C5C9C7']
  scrollHeight: 10
  scrollPastBottom: true
  scrollOffMargin: 2
  scrollOffBehavior: margin
  mouseEvents: true
  skipDiscardChangeWarning: false
  skipStashWarning: false
  skipNoStagedFilesWarning: false
  skipRewordInEditorWarning: false
  sidePanelWidth: 0.3333
  expandFocusedSidePanel: false
  expandedSidePanelWeight: 2
  mainPanelSplitMode: flexible
  enlargedSideViewLocation: left
  language: auto
  showListFooter: true
  showFileTree: true
  showRandomTip: true
  showCommandLog: true
  showBottomLine: true
  showPanelJumps: true
  showIcons: false
  showFileIcons: true
  commitAuthorShortLength: 2
  commitAuthorLongLength: 17
  commitHashLength: 8
  showBranchCommitHash: false
  showDivergenceFromBaseBranch: none
  commandLogSize: 8
  splitDiff: auto
  screenMode: normal
  border: rounded
  animateExplosion: true
  portraitMode: auto
  filterMode: substring
  statusPanelView: dashboard
